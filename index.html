<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম ভিডিও ডাউনলোডার</title>
    <!-- Importing Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        /* Animated Gradient Background */
        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            box-sizing: border-box;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-top: 4vh;
            transition: transform 0.3s ease;
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
            text-align: center;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        button.main-btn {
            padding: 0 28px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        button.main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Result Area Animations */
        #result {
            display: none;
            margin-top: 25px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        img.thumbnail {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h3 {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .formats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .format-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .format-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Loading Spinner */
        .loader-container {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 15px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--text-muted);
            font-weight: 600;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        .dev-credit {
            color: #c084fc;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .input-group { flex-direction: column; }
            button.main-btn { padding: 14px; }
            .formats { grid-template-columns: 1fr; }
            .glass-panel { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>ভিডিও ডাউনলোডার</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="এখানে ভিডিও লিংক পেস্ট করুন..." autocomplete="off">
            <button id="fetchBtn" class="main-btn" onclick="fetchInfo()">খুঁজুন</button>
        </div>

        <div id="loading" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">ভিডিওর তথ্য সংগ্রহ করা হচ্ছে...</div>
        </div>

        <div id="result">
            <img id="thumb" class="thumbnail" src="" alt="Video Thumbnail">
            <h3 id="videoTitle"></h3>
            <div id="formatsList" class="formats"></div>
        </div>
    </div>

    <div class="footer">
        ডেভেলপ করেছেন <span class="dev-credit">Ashikul Islam Abir</span>
    </div>

    <script>
        let currentUrl = "";

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            
            currentUrl = url;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('fetchBtn').disabled = true;

            try {
                const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                if(!data.title) throw new Error("Invalid response");

                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').textContent = data.title;
                
                const formatContainer = document.getElementById('formatsList');
                formatContainer.innerHTML = '';

                data.formats.forEach(h => {
                    const btn = document.createElement('button');
                    btn.className = 'format-btn';
                    btn.textContent = `${h}p ডাউনলোড`;
                    
                    btn.onclick = async () => {
                        const originalText = btn.textContent;
                        btn.textContent = 'প্রসেস হচ্ছে (~60s)...';
                        btn.style.opacity = '0.7';
                        btn.disabled = true;
                        
                        try {
                            const dlRes = await fetch(`/api/download?url=${encodeURIComponent(currentUrl)}&quality=${h}`);
                            const dlData = await dlRes.json();
                            
                            if(dlData.url) {
                                window.location.href = dlData.url;
                            } else {
                                alert("লিংক তৈরি করতে ব্যর্থ। সার্ভারে অতিরিক্ত চাপ থাকতে পারে।");
                            }
                        } catch(err) {
                            alert("সার্ভারের সাথে কানেক্ট করতে নেটওয়ার্ক সমস্যা হচ্ছে।");
                        }
                        
                        btn.textContent = originalText;
                        btn.style.opacity = '1';
                        btn.disabled = false;
                    };
                    formatContainer.appendChild(btn);
                });

                document.getElementById('result').style.display = 'block';
            } catch(e) {
                alert("ভিডিওটি এক্সট্র্যাক্ট করা যায়নি। লিংকটি সঠিক এবং পাবলিক কি না তা নিশ্চিত করুন।");
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('fetchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
