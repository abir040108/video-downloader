<!-- language: HTML, file: index.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>বাংলাদেশে এই প্রথম | ইউটিউব ভিডিও ডাউনলোডার</title>
    <!-- Importing Premium Bengali Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d4af37; /* Classic Gold */
            --primary-glow: rgba(212, 175, 55, 0.6);
            --bg-dark: #050505;
            --text-main: #ffffff;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            background: radial-gradient(circle at 50% 0%, #2a2105 0%, var(--bg-dark) 60%);
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Cinematic Entry Animation */
        .animate-fade-up {
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Royal Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-top: 6vh;
            position: relative;
        }

        /* Glowing Badge */
        .badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px var(--primary-glow);
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); }
        }

        /* Typography */
        .text-center { text-align: center; }
        
        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #d4af37, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }
        
        .cinematic-sub {
            color: #a19d94;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Input Controls */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 16px; /* 16px prevents iOS auto-zoom */
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            background: rgba(0, 0, 0, 0.8);
        }

        button.main-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 700;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        button.main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #ffd700, #d4af37);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Result Area */
        #result {
            display: none;
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        img.thumbnail {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        h3 {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #fff;
            line-height: 1.4;
        }

        .formats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .format-btn {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 16px 10px;
            color: #d4af37;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .format-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: var(--primary);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
        }

        /* Golden Spinner */
        .loader-container {
            display: none;
            text-align: center;
            margin: 40px 0;
        }
        
        .spinner {
            width: 45px;
            height: 45px;
            margin: 0 auto 20px auto;
            border: 4px solid rgba(212, 175, 55, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulse 1.5s ease infinite;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding: 40px 0 20px 0;
            color: #666;
            font-size: 1rem;
            text-align: center;
        }
        
        .dev-credit {
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* Desktop specific adjustments */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
            }
            button.main-btn {
                width: auto;
                padding: 16px 35px;
            }
            h1 {
                font-size: 2.6rem;
            }
        }
        
        /* Mobile extremely small devices */
        @media (max-width: 380px) {
            h1 { font-size: 1.8rem; }
            .formats { grid-template-columns: 1fr; }
            .glass-panel { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="glass-panel animate-fade-up">
        <div class="text-center">
            <div class="badge delay-1 animate-fade-up">🔥 এক্সক্লুসিভ</div>
            <h1 class="delay-2 animate-fade-up">বাংলাদেশে এই প্রথম<br>ইউটিউব ভিডিও ডাউনলোডার</h1>
            <p class="cinematic-sub delay-3 animate-fade-up">চোখের পলকে যেকোনো ইউটিউব ভিডিও নামিয়ে নিন সর্বোচ্চ কোয়ালিটিতে। সম্পূর্ণ ফ্রি, কোনো ঝামেলা ছাড়াই!</p>
        </div>
        
        <div class="input-group delay-3 animate-fade-up">
            <input type="text" id="urlInput" placeholder="ইউটিউব ভিডিওর লিংক এখানে দিন..." autocomplete="off">
            <button id="fetchBtn" class="main-btn" onclick="fetchInfo()">ম্যাজিক দেখুন</button>
        </div>

        <div id="loading" class="loader-container">
            <div class="spinner"></div>
            <div class="loader-text">ডেটা প্রসেস হচ্ছে...</div>
        </div>

        <div id="result">
            <img id="thumb" class="thumbnail" src="" alt="Video Thumbnail">
            <h3 id="videoTitle"></h3>
            <div id="formatsList" class="formats"></div>
        </div>
    </div>

    <div class="footer animate-fade-up delay-3">
        Developed with 💀 by <br><span class="dev-credit">Ashikul Islam Abir</span>
    </div>

    <script>
        let currentUrl = "";

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            
            currentUrl = url;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('fetchBtn').disabled = true;

            try {
                const res = await fetch(`/api/info?url=${encodeURIComponent(url)}`);
                const data = await res.json();

                if(!data.title) throw new Error("Invalid response");

                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').textContent = data.title;
                
                const formatContainer = document.getElementById('formatsList');
                formatContainer.innerHTML = '';

                data.formats.forEach(h => {
                    const btn = document.createElement('button');
                    btn.className = 'format-btn';
                    btn.textContent = `${h}p কোয়ালিটি`;
                    
                    btn.onclick = async () => {
                        const originalText = btn.textContent;
                        btn.textContent = 'ডাউনলোড হচ্ছে (~60s)...';
                        btn.style.opacity = '0.7';
                        btn.disabled = true;
                        
                        try {
                            const dlRes = await fetch(`/api/download?url=${encodeURIComponent(currentUrl)}&quality=${h}`);
                            const dlData = await dlRes.json();
                            
                            if(dlData.url) {
                                window.location.href = dlData.url;
                            } else {
                                alert("লিংক তৈরি করতে ব্যর্থ। সার্ভারে অতিরিক্ত চাপ থাকতে পারে।");
                            }
                        } catch(err) {
                            alert("সার্ভারের সাথে কানেক্ট করতে নেটওয়ার্ক সমস্যা হচ্ছে।");
                        }
                        
                        btn.textContent = originalText;
                        btn.style.opacity = '1';
                        btn.disabled = false;
                    };
                    formatContainer.appendChild(btn);
                });

                document.getElementById('result').style.display = 'block';
            } catch(e) {
                alert("ভিডিওটি এক্সট্র্যাক্ট করা যায়নি। লিংকটি সঠিক এবং পাবলিক কি না তা নিশ্চিত করুন।");
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('fetchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
